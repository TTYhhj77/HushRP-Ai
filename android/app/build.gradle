plugins {
    id 'com.android.application'
}

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from rootProject.file('../public')
    into file('src/main/assets')
}

preBuild.dependsOn(syncWebAssets)

android {
    namespace 'com.hushrp.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hushrp.app'
        minSdk 24
        targetSdk 35
        versionCode 120
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('HUSH_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('HUSH_KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('HUSH_KEY_ALIAS') ?: ''
                keyPassword System.getenv('HUSH_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            def ksPath = System.getenv('HUSH_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
